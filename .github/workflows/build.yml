name: Build Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-scripts:
    name: Package Engine Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create scripts archive
        run: |
          cd scripts
          zip -r ../engine-scripts.zip engines/

      - name: Upload scripts artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-scripts
          path: engine-scripts.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build DMG
        run: ./gradlew packageDmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: adventure-explorer-macos
          path: build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build MSI
        run: .\gradlew.bat packageMsi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: adventure-explorer-windows
          path: build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-scripts, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/engine-scripts/engine-scripts.zip
            artifacts/adventure-explorer-macos/*.dmg
            artifacts/adventure-explorer-windows/*.msi
          generate_release_notes: true
